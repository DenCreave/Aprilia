name: Deploy Aprilia to Cloudflare Pages

# This tells GitHub to run this script every time you push to the master/main branch
on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install WASM Tools Workload
      run: dotnet workload install wasm-tools

    - name: Publish Avalonia WebAssembly
      # This compiles the engine in Release mode (AOT) for maximum performance
      run: dotnet publish Aprilia.Browser/Aprilia.Browser.csproj -c Release -o release_output

    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: npx wrangler@latest pages deploy release_output/wwwroot --project-name=juliusdeer
